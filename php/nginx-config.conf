# Nginx Config for SDKarjo2
# Copy ke: /etc/nginx/sites-available/sdkarjo2
# Ganti DOMAIN dengan domain Anda
# Ganti PHP_VERSION dengan versi PHP yang terinstall

server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/sdkarjo2/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # Block access to sensitive files
    location ~ /(?:config\.php|schema\.sql|install\.php|includes|data) {
        deny all;
    }

    # Block .htaccess
    location ~ /\.ht {
        deny all;
    }

    # Cache static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Disable server version
    server_tokens off;
}

