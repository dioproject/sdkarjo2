name: sdkarjo2

services:
  postgres:
    image: postgres:16-alpine
    container_name: sdkarjo2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdkarjo2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-db-sdkarjo2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdkarjo2} -d ${POSTGRES_DB:-db-sdkarjo2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdkarjo2-net
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sdkarjo2-web:latest
    container_name: sdkarjo2-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sdkarjo2}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-db-sdkarjo2}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      - uploads_data:/app/public/uploads
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - sdkarjo2-net

volumes:
  postgres_data:
  uploads_data:

networks:
  sdkarjo2-net:
    driver: bridge
